# Boards in scope. Nothing outside this file may be queried or written to.
intake:
  project: PESD1
  base_url: https://pomelofashion.atlassian.net
  # Tickets in this status are candidates for triage.
  open_status: Waiting Support
  # Status PESD1 moves to once a clone has been created.
  dev_transition: To Do
  # Statuses that mean "still open" for duplicate detection.
  # Terminal statuses. PESD1 carries no resolution on closed tickets, so the
  # Historian needs this list to know what counts as settled precedent.
  resolved_statuses:
    - Live
    - Closed - Won't Do
  open_statuses:
    - Waiting Support
    - Waiting for customer
    - To Do
    - In progress
    - Blocked
    - Ready For Code Review
  # Custom field holding the requester email, if the instance has one.
  # Discover with: python -m core.jira_client fields --grep email
  # PESD1 has "Requester Email" (customfield_10304) but it is populated on 0 of
  # the last 300 tickets, so rule 1 cannot fire — the intake sheet does the work.
  requester_email_field: customfield_10304
  # The intake form's own fields. Most tickets carry the request here, with the
  # description holding only a Drive link — reading summary + description alone
  # escalated PESD1-11349/11353/11358 as "no request" (20 Oct 2026). Read as
  # request text by gates.request_text(); deliberately NOT in the content hash.
  form_fields:
    customfield_10251: Steps to reproduce
    customfield_10646: Current results
    customfield_10647: Expected outcome

development:
  project: PRDT
  # Issue type used for every clone. Must exist in PRDT's issue-type scheme —
  # check with: python -m core.jira_client issue-types --project PRDT
  issue_type: Story
  # Terminal statuses on PRDT — 162 of its tickets sit in "Live" with no
  # resolution set, and developer routing has to count them as finished work.
  resolved_statuses:
    - Live
    - Closed - Won't Do
  # Priority is CARRIED from the PESD1 ticket — the requester's urgency is the
  # fact, not something to re-derive. default_priority applies only when the
  # source ticket has none. Use priority_map if the two boards ever disagree on
  # names (both currently use Critical / High / Medium / Low).
  carry_priority: true
  priority_map: {}
  default_priority: Medium
  # The Jira API takes the link TYPE name here, not the inward/outward
  # description. 'Cloners' reads as "PRDT-x is cloned by PESD1-y".
  link_type: Cloners
  # Fields PRDT demands on create. Discover them with:
  #   python -m core.jira_client issue-types --project PRDT --required
  # Each entry is a Jira field id and the value object the API expects.
  required_fields:
    customfield_10199:
      value: Technology
  # PRDT validates that every Story has an Epic Link (createmeta does not
  # declare this — only a create attempt reveals it). Field id, then the epic
  # each component's clones belong under. `default` catches the rest; with no
  # default and no match, execution stops rather than guessing an epic.
  epic_link_field: customfield_10008
  # PRDT Epics carry their own name field.
  epic_name_field: customfield_10005
  epic_by_component:
    netsuite: PRDT-10732      # NetSuite Support Tickets
    api: PRDT-10842           # [API] API bugs and incidents
    business_continuity: PRDT-11608  # [Crashlytics] Fatal crash alerts
  # PESD1 Support Escalations — created for triage-raised work.
  default_epic: PRDT-11563

# Ticket families the board owner has already decided how to handle. A match
# skips duplicate search, the analyst and developer routing: the clone copies
# the PESD1 summary and description verbatim, with the labels and assignee
# below. It is still only a proposal — a human approves it like any other.
# The first label picks the epic via development.epic_by_component.
fixed_routes:
  - name: crashlytics
    # Firebase integration alerts, e.g. PESD1-11298, PESD1-11335 (decided
    # 28 Sep 2026, reconfirmed 12 Oct 2026: "this ticket will always need to
    # be processed by creating a PRDT ticket and assigning it to Rahul").
    summary_prefix: "[Crashlytics]"
    labels: [business_continuity, tech_ops]
    assignee: Rahul Ravindra
    comment: "This is an automated Crashlytics crash alert. It has been passed to the Android team as a development ticket, linked here."

# Ticket families whose correct developer is already known, but whose
# content still needs the normal case-by-case research and a case-aware
# comment — unlike fixed_routes above, nothing else here is skipped. The
# first label still picks the epic via development.epic_by_component, so an
# override's labels should lead with an epic that already resolves (e.g.
# "netsuite", not a label with no epic_by_component entry).
assignee_overrides:
  - name: ncg_item_creation
    # "Request to create new NCG item: <name> (<code>)" — the current intake
    # form's wording, confirmed against PESD1-11326/27/28/33/34 (28 Sep-9 Oct
    # 2026), all cloned to Vishal under PRDT-10732 "NetSuite Support
    # Tickets". Older tickets used different wording ("Request to Create New
    # SKU – ...") and are not covered — a widened prefix would also catch
    # PESD1-10877 "Unable to Process Receipts for NCG Transfer Orders", a
    # different problem entirely.
    summary_prefix: "Request to create new NCG item"
    assignee: Vishal Gaikwad
    labels: [netsuite, ncg]

# Hard allowlist. core/jira_client.py refuses any key outside this list.
allowed_projects:
  - PESD1
  - PRDT

# Boards the Chief of Staff tracks and ranks by priority. Every board here must
# belong to a project in allowed_projects — the client checks each issue it
# returns, so a board whose filter reaches wider raises rather than widening
# scope silently.
tracked_boards:
  - id: 381
    name: PESD1 board
    project: PESD1
  - id: 347
    name: Tech Ops
    project: PRDT
