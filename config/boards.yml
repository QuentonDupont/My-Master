# Boards in scope. Nothing outside this file may be queried or written to.
intake:
  project: PESD1
  base_url: https://pomelofashion.atlassian.net
  # Tickets in this status are candidates for triage.
  open_status: Waiting Support
  # Status PESD1 moves to once a clone has been created.
  dev_transition: To Do
  # Statuses that mean "still open" for duplicate detection.
  # Terminal statuses. PESD1 carries no resolution on closed tickets, so the
  # Historian needs this list to know what counts as settled precedent.
  resolved_statuses:
    - Live
    - Closed - Won't Do
  open_statuses:
    - Waiting Support
    - Waiting for customer
    - To Do
    - In progress
    - Blocked
    - Ready For Code Review
  # Custom field holding the requester email, if the instance has one.
  # Discover with: python -m core.jira_client fields --grep email
  # PESD1 has "Requester Email" (customfield_10304) but it is populated on 0 of
  # the last 300 tickets, so rule 1 cannot fire — the intake sheet does the work.
  requester_email_field: ""

development:
  project: PRDT
  # Issue type used for every clone. Must exist in PRDT's issue-type scheme —
  # check with: python -m core.jira_client issue-types --project PRDT
  issue_type: Story
  # Terminal statuses on PRDT — 162 of its tickets sit in "Live" with no
  # resolution set, and developer routing has to count them as finished work.
  resolved_statuses:
    - Live
    - Closed - Won't Do
  default_priority: Medium
  link_type: is cloned by
  # Fields PRDT demands on create. Discover them with:
  #   python -m core.jira_client issue-types --project PRDT --required
  # Each entry is a Jira field id and the value object the API expects.
  required_fields:
    customfield_10199:
      value: Technology
  # PRDT validates that every Story has an Epic Link (createmeta does not
  # declare this — only a create attempt reveals it). Field id, then the epic
  # each component's clones belong under. `default` catches the rest; with no
  # default and no match, execution stops rather than guessing an epic.
  epic_link_field: customfield_10008
  epic_by_component:
    netsuite: PRDT-10732      # NetSuite Support Tickets
    api: PRDT-10842           # [API] API bugs and incidents
  default_epic: ""

# Hard allowlist. core/jira_client.py refuses any key outside this list.
allowed_projects:
  - PESD1
  - PRDT
